<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta charset="utf-8">
<title>MiniChat</title>
<style>
/* ---------- grund ---------- */
html, body { height: 100%; margin: 0; overflow: hidden; background: #EDF2F7; color: #1F2A37;
  font-family: "Segoe UI", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; font-size: 14px; -ms-user-select: text;
  scrollbar-face-color: #C9D4E2; scrollbar-track-color: #EDF2F7; scrollbar-arrow-color: #EDF2F7; scrollbar-shadow-color: #EDF2F7;
  scrollbar-highlight-color: #EDF2F7; scrollbar-3dlight-color: #EDF2F7; scrollbar-darkshadow-color: #EDF2F7; }
button { font-family: inherit; }
svg { display: block; }
.hidden { display: none !important; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes popin { from { opacity: 0; transform: scale(.95) translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

/* ---------- avatarer ---------- */
.av { width: 32px; height: 32px; border-radius: 50%; background-color: #B9C6D6; background-position: center; background-size: cover;
  background-repeat: no-repeat; color: #fff; font-weight: 600; text-align: center; line-height: 32px; font-size: 14px; overflow: hidden; flex: 0 0 auto; }
.av.lg { width: 42px; height: 42px; line-height: 42px; font-size: 18px; }
.av.sm { width: 24px; height: 24px; line-height: 24px; font-size: 11px; }

/* ---------- header ---------- */
#header { position: absolute; top: 0; left: 0; right: 0; height: 68px; background: #fff; z-index: 5;
  box-shadow: 0 1px 0 #E3E9F0, 0 4px 16px rgba(16,24,40,.05); display: flex; align-items: center; padding: 0 12px 0 16px; }
.meblock { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; }
.avwrap { position: relative; flex: 0 0 auto; margin-right: 12px; cursor: pointer; transition: transform .15s; }
.avwrap:hover { transform: scale(1.05); }
.avwrap .status { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #34C759; border: 2px solid #fff; }
.meText { min-width: 0; }
.meText .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meText .sub { font-size: 12px; color: #6B7A90; margin-top: 1px; }

.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; outline: none; transition: background-color .15s, transform .1s; }
.ib svg { width: 22px; height: 22px; fill: #6B7A90; transition: fill .15s; }
.ib:hover { background: #EEF3F8; } .ib:hover svg { fill: #2F7FDB; }
.ib:active { transform: scale(.9); }

/* ---------- roster ---------- */
#roster { position: absolute; top: 68px; left: 0; right: 0; height: 48px; padding: 0 16px; display: flex; align-items: center;
  white-space: nowrap; overflow: hidden; font-size: 12px; color: #6B7A90; }
#roster .lbl { margin-right: 10px; flex: 0 0 auto; }
.chip { display: inline-flex; align-items: center; background: #fff; border-radius: 999px; padding: 3px 11px 3px 3px; margin-right: 8px;
  box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); color: #1F2A37; font-weight: 500; animation: pop .25s ease-out; flex: 0 0 auto; }
.chip .av.sm { margin-right: 7px; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #B9C6D6; margin-right: 8px; animation: pulse 1.6s ease-in-out infinite; }

/* ---------- logg ---------- */
#log { position: absolute; top: 116px; left: 0; right: 0; bottom: 92px; overflow-y: auto; overflow-x: hidden; padding: 6px 16px 10px; }
.sep { display: flex; justify-content: center; margin: 14px 0 6px; animation: fade .3s; }
.sep span { background: #E1E8F0; color: #6B7A90; font-size: 11px; padding: 3px 10px; border-radius: 999px; }
.sys { text-align: center; color: #94A3B8; font-size: 12px; margin: 8px 0; animation: fade .3s; }
.gname { font-size: 12px; color: #6B7A90; margin: 10px 0 3px 44px; animation: fade .3s; }
.msg { display: flex; align-items: flex-end; margin-top: 3px; animation: pop .22s ease-out; }
.msg.first { margin-top: 8px; }
.msg.me { justify-content: flex-end; }
.msg .avslot { width: 32px; height: 32px; flex: 0 0 32px; margin-right: 10px; }
.bubble { position: relative; max-width: 70%; min-width: 0; padding: 9px 14px; border-radius: 18px; line-height: 1.42; white-space: pre-wrap;
  word-wrap: break-word; font-size: 14.5px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08); }
.them .bubble { background: #fff; color: #1F2A37; }
.them.last .bubble { border-bottom-left-radius: 6px; }
.me .bubble { background: #DCEBFB; color: #13263F; }
.me.last .bubble { border-bottom-right-radius: 6px; }
.bubble a { color: #2F7FDB; text-decoration: none; cursor: pointer; }
.bubble a:hover { text-decoration: underline; }
.time { font-size: 11px; color: #94A3B8; margin: 3px 0 0 44px; animation: fade .3s; }
.time.me { text-align: right; margin: 3px 4px 0 0; }
.st { font-size: 11px; color: #94A3B8; text-align: right; margin: 3px 4px 0 0; }

/* filkort */
.file { display: flex; align-items: center; min-width: 230px; white-space: normal; }
.file .fic { width: 42px; height: 42px; border-radius: 13px; background: #EEF3F8; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex: 0 0 42px; }
.me .file .fic { background: rgba(255,255,255,.7); }
.file .fic svg { width: 22px; height: 22px; fill: #2F7FDB; }
.file .fbody { flex: 1 1 auto; min-width: 0; }
.file .fn { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .fm { font-size: 12px; color: #6B7A90; margin-top: 2px; }
.me .file .fm { color: #3B5775; }
.bar { height: 3px; border-radius: 2px; background: rgba(16,24,40,.08); margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 3px; width: 0; background: #2F7FDB; border-radius: 2px; transition: width .25s ease; }
.facts { margin-top: 8px; }
.facts a { display: inline-block; font-size: 12px; font-weight: 600; color: #2F7FDB; background: #EEF3F8; padding: 4px 11px; border-radius: 999px;
  margin-right: 6px; cursor: pointer; text-decoration: none !important; transition: background .15s, transform .1s; }
.facts a:hover { background: #DCEBFB; } .facts a:active { transform: scale(.96); }
.me .facts a { background: rgba(255,255,255,.75); }

/* ---------- composer ---------- */
#composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 10px; background: #EDF2F7; }
.pill { display: flex; align-items: flex-end; background: #fff; border-radius: 26px; padding: 5px 5px 5px 6px;
  box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 2px 8px rgba(16,24,40,.08); transition: box-shadow .15s; }
.pill.focus { box-shadow: 0 0 0 3px rgba(60,140,231,.2), 0 2px 8px rgba(16,24,40,.08); }
.pill .ib { flex: 0 0 40px; }
#input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font-family: inherit; font-size: 15px;
  line-height: 22px; padding: 9px 8px; height: 40px; max-height: 132px; overflow-y: auto; color: #1F2A37; box-sizing: border-box; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; flex: 0 0 40px; display: flex; align-items: center;
  justify-content: center; background: linear-gradient(135deg, #4A93EA, #2D7FDD); box-shadow: 0 4px 12px rgba(45,127,221,.35);
  transition: transform .12s, opacity .15s, box-shadow .15s; outline: none; margin-left: 2px; }
.send svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }
.send:hover { transform: scale(1.06); } .send:active { transform: scale(.94); }
.send.off { opacity: .4; box-shadow: none; transform: none; cursor: default; }
.hint { text-align: center; font-size: 11px; color: #A3B1C2; margin-top: 6px; }

/* ---------- popover-meny ---------- */
.pop { position: absolute; top: 60px; right: 12px; width: 304px; max-height: calc(100% - 76px); overflow-y: auto; overflow-x: hidden; background: #fff; border-radius: 16px; padding: 6px; z-index: 20;
  box-shadow: 0 12px 32px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); transform-origin: top right; animation: popin .18s ease-out; }
.mi { display: flex; align-items: center; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; transition: background .12s; }
.mi:hover { background: #F1F5F9; }
.mi svg { width: 20px; height: 20px; fill: #6B7A90; margin-right: 12px; flex: 0 0 20px; }
.mi .lab { flex: 1 1 auto; }
.mi.danger { color: #C0392B; } .mi.danger svg { fill: #C0392B; }
.mi.dis { opacity: .45; cursor: default; } .mi.dis:hover { background: transparent; }
.msep { height: 1px; background: #EDF2F7; margin: 5px 8px; }
.minfo { padding: 8px 12px 6px; font-size: 12px; color: #6B7A90; line-height: 1.55; }
.minfo b { color: #1F2A37; font-size: 13.5px; display: block; margin-bottom: 1px; }
.sw { width: 36px; height: 20px; border-radius: 999px; background: #CBD5E1; position: relative; transition: background .18s; flex: 0 0 36px; }
.sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .18s; }
.sw.on { background: #3C8CE7; } .sw.on i { left: 18px; }

/* ---------- modal ---------- */
#modal { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
#modal .bd { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(31,42,55,.35); animation: fade .2s; }
.card { position: relative; z-index: 1; width: 360px; background: #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(16,24,40,.25);
  padding: 22px 22px 18px; animation: popin .2s ease-out; }
.card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
.card p { margin: 0 0 14px; color: #6B7A90; font-size: 13px; line-height: 1.5; }
.inp { width: 100%; box-sizing: border-box; border: 1px solid #DCE3EC; border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 14px;
  outline: none; transition: border-color .15s, box-shadow .15s, background .15s; background: #F8FAFC; color: #1F2A37; }
.inp:focus { border-color: #3C8CE7; box-shadow: 0 0 0 3px rgba(60,140,231,.18); background: #fff; }
.btns { display: flex; justify-content: flex-end; margin-top: 16px; }
.btn { border: 0; border-radius: 999px; padding: 9px 18px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-left: 8px;
  transition: transform .1s, background .15s, box-shadow .15s; outline: none; }
.btn.pri { background: linear-gradient(135deg, #4A93EA, #2D7FDD); color: #fff; box-shadow: 0 4px 12px rgba(45,127,221,.3); }
.btn.pri:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(45,127,221,.35); }
.btn.gho { background: #EEF3F8; color: #1F2A37; } .btn.gho:hover { background: #E1E8F0; }
.btn:active { transform: scale(.97); }
.help { font-size: 13px; line-height: 1.55; color: #3B4A5E; max-height: 380px; overflow: auto; padding-right: 4px; }
.help ul { margin: 6px 0 10px; padding-left: 18px; } .help li { margin-bottom: 6px; }

/* ---------- välkommen ---------- */
#welcome { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #EDF2F7;
  background-image: radial-gradient(circle at 15% 10%, #DCEBFB 0, rgba(220,235,251,0) 55%), radial-gradient(circle at 85% 90%, #E6F0FA 0, rgba(230,240,250,0) 50%); }
.wcard { width: 380px; background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(16,24,40,.14); padding: 34px 32px 28px; text-align: center; animation: popin .35s ease-out; }
.wlogo { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 18px; background: linear-gradient(135deg, #4A93EA, #2D7FDD); display: flex; align-items: center;
  justify-content: center; box-shadow: 0 10px 24px rgba(45,127,221,.35); }
.wlogo svg { width: 38px; height: 38px; fill: #fff; }
.wcard h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.wcard p { margin: 0 0 20px; color: #6B7A90; font-size: 13.5px; line-height: 1.5; }
.wcard .inp { text-align: center; font-size: 16px; padding: 12px; }
.wcard .btn { width: 100%; margin: 14px 0 0; padding: 12px; }

/* ---------- status ---------- */
.avwrap .status.busy { background: #E5484D; }
.avwrap .status.away { background: #F5A623; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #34C759; margin-left: 7px; flex: 0 0 8px; }
.chip .dot.busy { background: #E5484D; }
.chip .dot.away { background: #F5A623; }
.seg { display: flex; background: #EEF3F8; border-radius: 999px; padding: 3px; margin: 4px 10px 8px; }
.seg div { flex: 1 1 50%; text-align: center; font-size: 12.5px; font-weight: 600; padding: 6px 0; border-radius: 999px; cursor: pointer; color: #6B7A90; transition: background .15s, color .15s, box-shadow .15s; }
.seg div.on { background: #fff; color: #1F2A37; box-shadow: 0 1px 3px rgba(16,24,40,.14); }
.seg div.on.busy { color: #C0392B; }
.awaynote { font-size: 11.5px; color: #B7791F; padding: 0 14px 8px; }

/* ---------- skriver… ---------- */
.typing .bubble { padding: 12px 16px; }
.dots { display: inline-block; height: 8px; }
.dots i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #A3B1C2; margin-right: 4px; animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; margin-right: 0; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .55; } 30% { transform: translateY(-5px); opacity: 1; } }

/* ---------- bilder ---------- */
.thumb { display: block; max-width: 100%; border-radius: 14px; cursor: pointer; margin-bottom: 8px; transition: transform .15s, box-shadow .15s; }
.thumb:hover { transform: scale(1.01); box-shadow: 0 6px 18px rgba(16,24,40,.18); }
.bubble.img { padding: 6px; }
.bubble.img .file { min-width: 0; padding: 0 6px 4px; }
.bubble.img .fic { display: none; }

/* ---------- reaktioner & sett ---------- */
.rbar { position: absolute; top: -26px; right: -2px; display: flex; background: #fff; border-radius: 999px; padding: 3px 5px; z-index: 3;
  box-shadow: 0 6px 18px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); opacity: 0; visibility: hidden; transform: translateY(4px) scale(.95);
  transition: opacity .15s, transform .15s, visibility .15s; }
.me .rbar { right: auto; left: -2px; }
.bubble:hover .rbar { opacity: 1; visibility: visible; transform: none; }
.rbar span { font-size: 17px; line-height: 26px; width: 28px; text-align: center; border-radius: 50%; cursor: pointer; transition: transform .12s, background .12s; }
.rbar span:hover { transform: scale(1.3); background: #EEF3F8; }
.rx { position: absolute; bottom: -11px; right: 10px; display: flex; }
.me .rx { right: auto; left: 10px; }
.rx span { display: inline-block; background: #fff; border-radius: 999px; padding: 1px 7px; font-size: 12px; margin-left: 4px; animation: pop .2s; cursor: default;
  box-shadow: 0 1px 3px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); }
.rx span.mine { background: #DCEBFB; }
.msg.has-rx { margin-bottom: 12px; }
.seenlbl { color: #3C8CE7; }

/* ---------- moln ---------- */
.chip .cl { width: 14px; height: 14px; margin-left: 6px; fill: #8FA3BB; }
.minfo .cloudline { margin-top: 2px; }
.minfo .cloudline.ok { color: #2E9E5B; }

/* ---------- toast ---------- */
#toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(31,42,55,.92); color: #fff; font-size: 13px; padding: 9px 16px;
  border-radius: 999px; box-shadow: 0 8px 24px rgba(16,24,40,.25); opacity: 0; visibility: hidden; transition: opacity .25s, transform .25s, visibility .25s; z-index: 30; white-space: nowrap; }
#toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<div id="app" class="hidden">
  <div id="header">
    <div class="meblock">
      <div class="avwrap" id="meAvWrap" title="Byt profilbild"><div class="av lg" id="meAv"></div><span class="status"></span></div>
      <div class="meText"><div class="name" id="meName">MiniChat</div><div class="sub" id="meSub">Tillgänglig · krypterat · Peer-to-peer</div></div>
    </div>
    <button class="ib" id="nudgeBtn" title="Knacka på – skakar fönstret hos de andra"></button>
    <button class="ib" id="gearBtn" title="Inställningar"></button>
  </div>
  <div id="roster"></div>
  <div id="log"></div>
  <div id="composer">
    <div class="pill" id="pill">
      <button class="ib" id="attachBtn" title="Skicka fil"></button>
      <textarea id="input" rows="1" placeholder="Skriv ett meddelande…"></textarea>
      <button class="ib" id="emojiBtn" title="Emoji"></button>
      <button class="send off" id="sendBtn" title="Skicka"></button>
    </div>
    <div class="hint">Enter skickar · Shift+Enter ny rad · dra in filer eller klistra in med Ctrl+V</div>
  </div>
  <div id="menu" class="pop hidden"></div>
  <div id="toast"></div>
</div>

<div id="welcome" class="hidden">
  <div class="wcard">
    <div class="wlogo" id="wlogo"></div>
    <h1>Hej!</h1>
    <p>Vad heter du? Namnet visas för den du chattar med och sparas på den här datorn. Inget konto behövs.</p>
    <input class="inp" id="wname" maxlength="32" placeholder="Ditt namn" autocomplete="off">
    <input class="inp" id="wcode" maxlength="64" placeholder="Familjekod (valfri – för internet)" autocomplete="off" style="margin-top:10px;font-size:14px;padding:10px">
    <button class="btn pri" id="wbtn">Börja chatta</button>
  </div>
</div>

<div id="modal" class="hidden"><div class="bd" id="mbd"></div><div class="card" id="mcard"></div></div>

function renderText(container, s) {

    last = mt.index + mt[0].length;

  if (last < s.length) text(container, s.substring(last));

  if (!typingRow) {
    typingRow = el('div', 'msg them typing first last');
    var slot = el('div', 'avslot'); typingRow.appendChild(slot);
    var b = el('div', 'bubble');
    var d = el('span', 'dots'); d.appendChild(el('i')); d.appendChild(el('i')); d.appendChild(el('i'));
    b.appendChild(d);
    typingRow.appendChild(b);
    typingRow.appendChild(el('div', 'gname'));
  }
  var slots = typingRow.getElementsByTagName('div');
  for (var j = 0; j < slots.length; j++) {
    if (slots[j].className === 'avslot') { slots[j].innerHTML = ''; slots[j].appendChild(makeAv(list[0].id, list[0].name)); }
    if (slots[j].className === 'gname') { slots[j].innerHTML = ''; text(slots[j], label); slots[j].style.margin = '0 0 0 10px'; slots[j].style.alignSelf = 'center'; }
  }
  log.appendChild(typingRow);
  scrollDown(false);
}

function fileThumb(id, url) {
  var row = $('r_' + id); if (!row) return;
  var bubbles = row.querySelectorAll('.bubble'); if (!bubbles.length) return;
  var b = bubbles[0];
  if (b.className.indexOf('img') >= 0) return;
  b.className += ' img';
  var img = document.createElement('img');
  img.className = 'thumb'; img.src = url; img.title = 'Öppna';
  img.onclick = function () { ext.call('openFile', id); return false; };
  img.onload = function () { scrollDown(false); };
  b.insertBefore(img, b.firstChild);
}

function seen(id, label) {
  var olds = document.querySelectorAll('.seenlbl');
  for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
  var row = $('r_' + id); if (!row) return;
  var b = row.querySelectorAll('.bubble')[0]; if (!b) return;
  var d = el('div', 'st seenlbl'); text(d, '\u2713 ' + label);
  b.appendChild(d);
  scrollDown(false);
}

function attachReactBar(row, id) {
  var b = row.querySelectorAll('.bubble')[0]; if (!b) return;
  var bar = el('div', 'rbar');
  for (var i = 0; i < EMOJIS.length; i++) {
    (function (e) {
      var sp = el('span'); text(sp, e); sp.title = 'Reagera';
      sp.onclick = function (ev) { stop(ev); ext.call('react', id, e); return false; };
      bar.appendChild(sp);
    })(EMOJIS[i]);
  }
  b.appendChild(bar);
}

function react(id, emoji, name, on) {
  var r = reactions[id] || (reactions[id] = {});
  var who = r[emoji] || (r[emoji] = []);
  var idx = who.indexOf(name);
  if (on && idx < 0) who.push(name);
  if (!on && idx >= 0) who.splice(idx, 1);
  if (!who.length) delete r[emoji];
  var row = $('r_' + id); if (!row) return;
  var b = row.querySelectorAll('.bubble')[0]; if (!b) return;
  var old = b.querySelectorAll('.rx'); for (var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  var keys = []; for (var k in r) if (r.hasOwnProperty(k)) keys.push(k);
  row.className = row.className.replace(/\s*\bhas-rx\b/, '') + (keys.length ? ' has-rx' : '');
  if (!keys.length) return;
  var rx = el('div', 'rx');
  for (var j = 0; j < keys.length; j++) {
    var sp = el('span', r[keys[j]].indexOf(me.name) >= 0 ? 'mine' : '');
    text(sp, keys[j] + (r[keys[j]].length > 1 ? ' ' + r[keys[j]].length : ''));
    sp.title = r[keys[j]].join(', ');
    rx.appendChild(sp);
  }
  b.appendChild(rx);
}

var typingWas = false;
function signalTyping() {
  var has = input.value.replace(/^\s+|\s+$/g, '') !== '';
  if (has || typingWas) ext.call('typing', has);
  typingWas = has;
}

function toast(s) {
  toastEl.innerHTML = ''; text(toastEl, s);
  toastEl.className = 'show';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.className = ''; }, 2600);
}

// ============================================================ composer
function sendNow() {
  var t = input.value;
  if (!t.replace(/^\s+|\s+$/g, '')) return;
  ext.call('send', t);
  input.value = '';
  typingWas = false;
  autosize(); updateSend();
  input.focus();
}
function autosize() {
  input.style.height = '40px';
  var h = Math.min(input.scrollHeight, 132);
  if (h > 40) input.style.height = h + 'px';
  layout();
}
function updateSend() { $('sendBtn').className = input.value.replace(/^\s+|\s+$/g, '') ? 'send' : 'send off'; }
function layout() {
  var c = $('composer');
  if (c && log) { log.style.bottom = c.offsetHeight + 'px'; if (stuck) log.scrollTop = log.scrollHeight; }
}

// ============================================================ välkommen
function finishWelcome() {
  var n = $('wname').value.replace(/^\s+|\s+$/g, '');
  if (!n) { $('wname').focus(); return; }
  var c = $('wcode').value.replace(/^\s+|\s+$/g, '');
  ext.call('setName', n);
  if (c) ext.call('setCloudCode', c);
}

// ============================================================ meny
function toggleMenu() { if (menuEl.className.match(/hidden/)) openMenu(); else closeMenu(); }
function openMenu() { renderMenu(); menuEl.className = 'pop'; }
function closeMenu() { menuEl.className = 'pop hidden'; }
function renderMenu() {
  menuEl.innerHTML = '';
  var inf = el('div', 'minfo');
  inf.appendChild(text(el('b'), me.name || 'MiniChat'));
  text(inf, (info.ip ? info.ip : 'ingen IP') + (info.port ? ' · port ' + info.port : ''));
  var cl = el('div', 'cloudline' + (info.cloud === 'ansluten' ? ' ok' : ''));
  text(cl, 'Molnbrygga: ' + (info.cloud || 'av') + (info.cloudCode ? '' : ' – ingen familjekod'));
  inf.appendChild(cl);
  menuEl.appendChild(inf);
  var seg = el('div', 'seg');
  var o1 = text(el('div', 'online' + (myStatus.chosen === 'online' ? ' on' : '')), 'Tillgänglig');
  var o2 = text(el('div', 'busy' + (myStatus.chosen === 'busy' ? ' on' : '')), 'Upptagen');
  o1.onclick = function (e) { stop(e); ext.call('setStatus', 'online'); closeMenu(); };
  o2.onclick = function (e) { stop(e); ext.call('setStatus', 'busy'); closeMenu(); };
  seg.appendChild(o1); seg.appendChild(o2);
  menuEl.appendChild(seg);
  if (myStatus.status === 'away') menuEl.appendChild(text(el('div', 'awaynote'), 'Just nu: Ej vid datorn (sätts automatiskt efter 10 min utan aktivitet)'));
  sep();
  item(I.edit, 'Byt namn…', promptName);
  item(I.image, 'Välj profilbild…', function () { ext.call('pickAvatar'); });
  item(I.close, 'Ta bort profilbild', function () { ext.call('removeAvatar'); }, !settings.hasAvatar);
  sep();
  item(I.key, 'Familjekod (internet)…', promptCloudCode);
  item(I.link, 'Anslut till adress…', promptAddress);
  item(I.eth, 'Lyssnarport…', promptPort);
  item(I.cloud, 'Molnserver…', promptCloudServer);
  item(I.forget, 'Glöm sparade adresser', function () { ext.call('forgetAddresses'); });
  sep();
  toggle(I.volume, 'Ljud vid nytt meddelande', 'sound');
  toggle(I.bell, 'Avisering vid klockan', 'notify');
  toggle(I.download, 'Ta emot filer automatiskt', 'autoAccept');
  toggle(I.renew, 'Starta med Windows', 'autostart');
  item(I.folder, 'Mottagna filer', function () { ext.call('openDownloads'); });
  item(I.sound, 'Egna ljud (mappen ljud)', function () { ext.call('openSounds'); });
  sep();
  item(I.clear, 'Rensa chatten och historiken', function () { clearAll(); ext.call('clearChat'); });
  item(I.info, 'Så funkar det', showHelp);
  item(I.power, 'Avsluta MiniChat', function () { ext.call('exit'); }, false, true);

  function sep() { menuEl.appendChild(el('div', 'msep')); }
  function item(icon, label, fn, disabled, danger) {
    var d = el('div', 'mi' + (disabled ? ' dis' : '') + (danger ? ' danger' : ''));
    d.innerHTML = svg(icon);
    d.appendChild(text(el('span', 'lab'), label));
    if (!disabled) d.onclick = function (e) { stop(e); closeMenu(); fn(); };
    menuEl.appendChild(d);
  }
  function toggle(icon, label, key) {
    var d = el('div', 'mi');
    d.innerHTML = svg(icon);
    d.appendChild(text(el('span', 'lab'), label));
    var sw = el('div', 'sw' + (settings[key] ? ' on' : '')); sw.appendChild(el('i'));
    d.appendChild(sw);
    d.onclick = function (e) { stop(e); settings[key] = !settings[key]; sw.className = 'sw' + (settings[key] ? ' on' : ''); ext.call('toggle', key); };
    menuEl.appendChild(d);
  }
}

// ============================================================ modaler
function closeModal() { $('modal').className = 'hidden'; focusInput(); }
function ask(title, desc, value, placeholder, cb, allowEmpty) {
  var card = $('mcard'); card.innerHTML = '';
  card.appendChild(text(el('h3'), title));
  card.appendChild(text(el('p'), desc));
  var inp = el('input', 'inp'); inp.value = value || ''; inp.placeholder = placeholder || ''; inp.maxLength = 120;
  card.appendChild(inp);
  var btns = el('div', 'btns');
  var cancel = text(el('button', 'btn gho'), 'Avbryt'); cancel.onclick = closeModal;
  var ok = text(el('button', 'btn pri'), 'OK');
  ok.onclick = function () { var v = inp.value.replace(/^\s+|\s+$/g, ''); if (!v && !allowEmpty) { inp.focus(); return; } closeModal(); cb(v); };
  inp.onkeydown = function (e) { if (e.keyCode === 13) { ok.onclick(); return false; } if (e.keyCode === 27) { closeModal(); return false; } };
  btns.appendChild(cancel); btns.appendChild(ok);
  card.appendChild(btns);
  $('modal').className = '';
  setTimeout(function () { inp.focus(); inp.select(); }, 30);
}
function promptName() { ask('Byt namn', 'Namnet visas för de du chattar med.', me.name, 'Ditt namn', function (v) { ext.call('setName', v); }); }
function promptAddress() {
  ask('Anslut till adress', 'IP-adress eller värdnamn till den andra datorn, t.ex. 192.168.1.20 eller hem.exempel.se:443. Standardport är 48555. Adressen sparas och återansluts automatiskt.', '', 'adress[:port]',
    function (v) { ext.call('addAddress', v); });
}
function promptCloudCode() {
  ask('Familjekod', 'Samma kod på alla era datorer. Med den når ni varandra via internet (krypterat via en publik ntfy-server på port 443) när ni inte är på samma nät. Välj något långt och eget, t.ex. tre ord. Tomt = stäng av.',
    info.cloudCode || '', 't.ex. kanelbulle-tisdag-42', function (v) { ext.call('setCloudCode', v); }, true);
}
function promptCloudServer() {
  ask('Molnserver', 'Adress till ntfy-servern som molnbryggan använder. Standard är https://ntfy.sh. Kör du en egen ntfy-server slipper du gränserna.',
    info.cloudServer || 'https://ntfy.sh', 'https://ntfy.sh', function (v) { ext.call('setCloudServer', v); }, true);
}
function promptPort() {
  ask('Lyssnarport', 'TCP-port som andra ansluter till. Gäller nästa gång MiniChat startas.', info.port, '48555',
    function (v) { if (!/^\d{1,5}$/.test(v) || +v < 1 || +v > 65535) { toast('Ange ett tal mellan 1 och 65535'); return; } ext.call('setPort', v); });
}
function showHelp() {
  var card = $('mcard'); card.innerHTML = '';
  card.appendChild(text(el('h3'), 'Så funkar MiniChat'));
  var h = el('div', 'help');
  h.innerHTML =
    '<p>En liten chatt utan server och utan konton. Allt som skickas är krypterat (ECDH + AES-256).</p><ul>' +
    '<li><b>Samma nätverk:</b> datorerna hittar varandra automatiskt.</li>' +
    '<li><b>Olika nätverk, enklast:</b> ⚙ → <i>Familjekod</i> – samma kod på båda datorerna. Då går meddelandena krypterade via en publik ntfy-server över HTTPS när ni inte är på samma nät. Servern kan inte läsa dem. Meddelanden som skickas när den andra är offline ligger kvar i upp till 12 timmar. Gratisnivån tål en familjs chatt (ca 250 meddelanden per dag och dator); filer upp till 5 MB.</li>' +
    '<li><b>Olika nätverk, utan mellanhand:</b> ⚙ → <i>Anslut till adress…</i> och skriv den andras IP (ev. :port). Minst en av er måste gå att nå utifrån, t.ex. via en port som vidarebefordras i hemroutern.</li>' +
    '<li><b>Fler än två:</b> alla kopplar ihop sig och skickar vidare åt varandra, så en tredje dator (t.ex. hemma) kan länka två som inte når varandra direkt.</li>' +
    '<li><b>Filer:</b> dra in dem i fönstret, tryck gemet eller klistra in med Ctrl+V. Mottagna filer hamnar i <i>Hämtade filer\\MiniChat</i>.</li>' +
    '<li><b>Ljud:</b> skriv <b>*prutt*</b> eller <b>*skratt*</b> så spelas ljudet upp hos den andra – utan att synas i chatten. Lägg egna .wav- eller .mp3-filer i mappen <i>ljud</i> bredvid MiniChat.exe så blir <b>*filnamn*</b> ett nytt ljud (max 3 MB). Ljudet spelas hos de andra, inte hos dig.</li>' +
    '<li><b>Status:</b> välj Tillgänglig eller Upptagen i menyn. Upptagen tystar ljud och aviseringar (prutt, skratt och knackningar hörs ändå). Efter 10 minuter utan aktivitet visas du som Ej vid datorn.</li>' +
    '<li><b>Knacka:</b> klockan uppe till höger skakar fönstret hos de andra och plockar fram det.</li>' +
    '<li><b>Reaktioner:</b> håll musen över en bubbla och välj en emoji. "Sett" visas under ditt senaste meddelande när den andra har läst det.</li>' +
    '<li><b>Historik:</b> de senaste 30 dagarna sparas krypterat på den här datorn.</li>' +
    '<li><b>Emoji:</b> ☺-knappen eller Windows-tangenten + punkt.</li>' +
    '</ul><p>Port 48555 (TCP) och 48556 (UDP) används som standard. Windows kan fråga om brandväggen första gången – svara Tillåt om du kan.</p>';
  card.appendChild(h);
  var btns = el('div', 'btns');
  var ok = text(el('button', 'btn pri'), 'Stäng'); ok.onclick = closeModal;
  btns.appendChild(ok); card.appendChild(btns);
  $('modal').className = '';
}

init();
</script>
