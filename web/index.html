<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiniChat">
<meta name="theme-color" content="#EDF2F7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>MiniChat</title>
<style>
/* ---------- grund ---------- */
html, body { height: 100%; margin: 0; overflow: hidden; background: #EDF2F7; color: #1F2A37; position: fixed; width: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 15px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; -webkit-appearance: none; }
svg { display: block; }
.hidden { display: none !important; }
#app { position: absolute; top: 0; left: 0; right: 0; height: 100%; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes popin { from { opacity: 0; transform: scale(.95) translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: .9; } 100% { opacity: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
.shaking { animation: shake .5s ease-in-out; }
#flash { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #3C8CE7; opacity: 0; pointer-events: none; z-index: 60; }
#flash.on { animation: flash .7s ease-out; }

/* ---------- avatarer ---------- */
.av { width: 32px; height: 32px; border-radius: 50%; background-color: #B9C6D6; background-position: center; background-size: cover; background-repeat: no-repeat;
  color: #fff; font-weight: 600; text-align: center; line-height: 32px; font-size: 14px; overflow: hidden; flex: 0 0 auto; }
.av.lg { width: 42px; height: 42px; line-height: 42px; font-size: 18px; }
.av.sm { width: 24px; height: 24px; line-height: 24px; font-size: 11px; }

/* ---------- header ---------- */
#header { position: absolute; top: 0; left: 0; right: 0; height: calc(64px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: #fff; z-index: 5;
  box-shadow: 0 1px 0 #E3E9F0, 0 4px 16px rgba(16,24,40,.05); display: flex; align-items: center; padding-left: 14px; padding-right: 8px; box-sizing: border-box; }
.meblock { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; }
.avwrap { position: relative; flex: 0 0 auto; margin-right: 12px; cursor: pointer; }
.avwrap .status { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #34C759; border: 2px solid #fff; }
.avwrap .status.busy { background: #E5484D; }
.avwrap .status.away { background: #F5A623; }
.meText { min-width: 0; }
.meText .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meText .sub { font-size: 12px; color: #6B7A90; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; outline: none; transition: background-color .15s, transform .1s; flex: 0 0 42px; }
.ib svg { width: 22px; height: 22px; fill: #6B7A90; transition: fill .15s; }
.ib:active { transform: scale(.9); background: #EEF3F8; }

/* ---------- roster ---------- */
#roster { position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 0; right: 0; height: 44px; padding: 0 14px; display: flex; align-items: center;
  white-space: nowrap; overflow-x: auto; overflow-y: hidden; font-size: 12px; color: #6B7A90; -webkit-overflow-scrolling: touch; }
#roster .lbl { margin-right: 10px; flex: 0 0 auto; }
.chip { display: inline-flex; align-items: center; background: #fff; border-radius: 999px; padding: 3px 11px 3px 3px; margin-right: 8px;
  box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); color: #1F2A37; font-weight: 500; animation: pop .25s ease-out; flex: 0 0 auto; }
.chip .av.sm { margin-right: 7px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #34C759; margin-left: 7px; flex: 0 0 8px; }
.chip .dot.busy { background: #E5484D; }
.chip .dot.away { background: #F5A623; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #B9C6D6; margin-right: 8px; animation: pulse 1.6s ease-in-out infinite; }
.conn { margin-left: auto; padding-left: 10px; flex: 0 0 auto; color: #B7791F; }
.conn.ok { color: #2E9E5B; }

/* ---------- logg ---------- */
#log { position: absolute; top: calc(108px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 90px; overflow-y: auto; overflow-x: hidden; padding: 6px 14px 10px; -webkit-overflow-scrolling: touch; }
.sep { display: flex; justify-content: center; margin: 14px 0 6px; animation: fade .3s; }
.sep span { background: #E1E8F0; color: #6B7A90; font-size: 11px; padding: 3px 10px; border-radius: 999px; }
.sys { text-align: center; color: #94A3B8; font-size: 12px; margin: 8px 0; animation: fade .3s; }
.gname { font-size: 12px; color: #6B7A90; margin: 10px 0 3px 44px; animation: fade .3s; }
.msg { display: flex; align-items: flex-end; margin-top: 3px; animation: pop .22s ease-out; }
.msg.first { margin-top: 8px; }
.msg.me { justify-content: flex-end; }
.msg .avslot { width: 32px; height: 32px; flex: 0 0 32px; margin-right: 10px; }
.bubble { position: relative; max-width: 76%; min-width: 0; padding: 9px 14px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap;
  word-wrap: break-word; overflow-wrap: anywhere; font-size: 15px; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08); -webkit-user-select: text; user-select: text; }
.them .bubble { background: #fff; color: #1F2A37; }
.them.last .bubble { border-bottom-left-radius: 6px; }
.me .bubble { background: #DCEBFB; color: #13263F; }
.me.last .bubble { border-bottom-right-radius: 6px; }
.bubble a { color: #2F7FDB; text-decoration: none; }
.time { font-size: 11px; color: #94A3B8; margin: 3px 0 0 44px; animation: fade .3s; }
.time.me { text-align: right; margin: 3px 4px 0 0; }
.st { font-size: 11px; color: #94A3B8; text-align: right; margin: 3px 4px 0 0; }
.seenlbl { color: #3C8CE7; }

/* filkort & bilder */
.file { display: flex; align-items: center; min-width: 200px; white-space: normal; }
.file .fic { width: 42px; height: 42px; border-radius: 13px; background: #EEF3F8; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex: 0 0 42px; }
.me .file .fic { background: rgba(255,255,255,.7); }
.file .fic svg { width: 22px; height: 22px; fill: #2F7FDB; }
.file .fbody { flex: 1 1 auto; min-width: 0; }
.file .fn { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .fm { font-size: 12px; color: #6B7A90; margin-top: 2px; }
.me .file .fm { color: #3B5775; }
.bar { height: 3px; border-radius: 2px; background: rgba(16,24,40,.08); margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 3px; width: 0; background: #2F7FDB; border-radius: 2px; transition: width .25s ease; }
.facts { margin-top: 8px; }
.facts a { display: inline-block; font-size: 12px; font-weight: 600; color: #2F7FDB; background: #EEF3F8; padding: 5px 11px; border-radius: 999px; margin-right: 6px; cursor: pointer; text-decoration: none !important; }
.me .facts a { background: rgba(255,255,255,.75); }
.thumb { display: block; max-width: 100%; max-height: 320px; border-radius: 14px; cursor: pointer; margin-bottom: 8px; }
.bubble.img { padding: 6px; }
.bubble.img .file { min-width: 0; padding: 0 6px 4px; }
.bubble.img .fic { display: none; }

/* reaktioner */
.rbar { position: absolute; top: -34px; right: -2px; display: flex; background: #fff; border-radius: 999px; padding: 4px 6px; z-index: 3;
  box-shadow: 0 6px 18px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); opacity: 0; visibility: hidden; transform: translateY(4px) scale(.95);
  transition: opacity .15s, transform .15s, visibility .15s; }
.me .rbar { right: auto; left: -2px; }
.bubble.show .rbar { opacity: 1; visibility: visible; transform: none; }
@media (hover: hover) { .bubble:hover .rbar { opacity: 1; visibility: visible; transform: none; } }
.rbar span { font-size: 20px; line-height: 30px; width: 34px; text-align: center; border-radius: 50%; cursor: pointer; }
.rbar span:active { transform: scale(1.25); background: #EEF3F8; }
.rx { position: absolute; bottom: -11px; right: 10px; display: flex; }
.me .rx { right: auto; left: 10px; }
.rx span { display: inline-block; background: #fff; border-radius: 999px; padding: 1px 7px; font-size: 12px; margin-left: 4px; animation: pop .2s;
  box-shadow: 0 1px 3px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); }
.rx span.mine { background: #DCEBFB; }
.msg.has-rx { margin-bottom: 12px; }

/* ---------- composer ---------- */
#composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: #EDF2F7; }
.pill { display: flex; align-items: flex-end; background: #fff; border-radius: 26px; padding: 5px 5px 5px 4px;
  box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 2px 8px rgba(16,24,40,.08); transition: box-shadow .15s; }
.pill.focus { box-shadow: 0 0 0 3px rgba(60,140,231,.2), 0 2px 8px rgba(16,24,40,.08); }
.pill .ib { flex: 0 0 40px; width: 40px; height: 40px; }
#input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font-family: inherit; font-size: 16px;
  line-height: 22px; padding: 9px 6px; height: 40px; max-height: 132px; overflow-y: auto; color: #1F2A37; box-sizing: border-box; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; flex: 0 0 40px; display: flex; align-items: center;
  justify-content: center; background: linear-gradient(135deg, #4A93EA, #2D7FDD); box-shadow: 0 4px 12px rgba(45,127,221,.35);
  transition: transform .12s, opacity .15s, box-shadow .15s; outline: none; margin-left: 2px; }
.send svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }
.send:active { transform: scale(.94); }
.send.off { opacity: .4; box-shadow: none; transform: none; }
.hint { text-align: center; font-size: 11px; color: #A3B1C2; margin-top: 6px; }

/* ---------- meny ---------- */
.pop { position: absolute; top: calc(56px + env(safe-area-inset-top)); right: 10px; width: 300px; max-width: calc(100% - 20px); max-height: calc(100% - 120px); overflow-y: auto; background: #fff;
  border-radius: 16px; padding: 6px; z-index: 20; box-shadow: 0 12px 32px rgba(16,24,40,.18), 0 0 0 1px rgba(16,24,40,.04); transform-origin: top right; animation: popin .18s ease-out; -webkit-overflow-scrolling: touch; }
.mi { display: flex; align-items: center; padding: 11px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.mi:active { background: #F1F5F9; }
.mi svg { width: 20px; height: 20px; fill: #6B7A90; margin-right: 12px; flex: 0 0 20px; }
.mi .lab { flex: 1 1 auto; }
.mi.danger { color: #C0392B; } .mi.danger svg { fill: #C0392B; }
.msep { height: 1px; background: #EDF2F7; margin: 5px 8px; }
.minfo { padding: 8px 12px 6px; font-size: 12px; color: #6B7A90; line-height: 1.55; }
.minfo b { color: #1F2A37; font-size: 14px; display: block; margin-bottom: 1px; }
.minfo .ok { color: #2E9E5B; }
.sw { width: 36px; height: 20px; border-radius: 999px; background: #CBD5E1; position: relative; transition: background .18s; flex: 0 0 36px; }
.sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .18s; }
.sw.on { background: #3C8CE7; } .sw.on i { left: 18px; }
.seg { display: flex; background: #EEF3F8; border-radius: 999px; padding: 3px; margin: 4px 10px 8px; }
.seg div { flex: 1 1 50%; text-align: center; font-size: 13px; font-weight: 600; padding: 7px 0; border-radius: 999px; cursor: pointer; color: #6B7A90; transition: background .15s, color .15s; }
.seg div.on { background: #fff; color: #1F2A37; box-shadow: 0 1px 3px rgba(16,24,40,.14); }
.seg div.on.busy { color: #C0392B; }

/* ---------- modal ---------- */
#modal { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
#modal .bd { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(31,42,55,.35); animation: fade .2s; }
.card { position: relative; z-index: 1; width: 340px; max-width: calc(100% - 32px); box-sizing: border-box; background: #fff; border-radius: 20px; box-shadow: 0 20px 50px rgba(16,24,40,.25);
  padding: 22px 20px 18px; animation: popin .2s ease-out; }
.card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
.card p { margin: 0 0 14px; color: #6B7A90; font-size: 13px; line-height: 1.5; }
.inp { width: 100%; box-sizing: border-box; border: 1px solid #DCE3EC; border-radius: 12px; padding: 11px 12px; font-family: inherit; font-size: 16px;
  outline: none; background: #F8FAFC; color: #1F2A37; }
.inp:focus { border-color: #3C8CE7; box-shadow: 0 0 0 3px rgba(60,140,231,.18); background: #fff; }
.btns { display: flex; justify-content: flex-end; margin-top: 16px; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-left: 8px; outline: none; }
.btn.pri { background: linear-gradient(135deg, #4A93EA, #2D7FDD); color: #fff; box-shadow: 0 4px 12px rgba(45,127,221,.3); }
.btn.gho { background: #EEF3F8; color: #1F2A37; }
.btn:active { transform: scale(.97); }
.help { font-size: 13px; line-height: 1.55; color: #3B4A5E; max-height: 60vh; overflow: auto; padding-right: 4px; }
.help ul { margin: 6px 0 10px; padding-left: 18px; } .help li { margin-bottom: 6px; }

/* ---------- välkommen ---------- */
#welcome { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: #EDF2F7; padding: 16px; box-sizing: border-box;
  background-image: radial-gradient(circle at 15% 10%, #DCEBFB 0, rgba(220,235,251,0) 55%), radial-gradient(circle at 85% 90%, #E6F0FA 0, rgba(230,240,250,0) 50%); overflow: auto; }
.wcard { width: 360px; max-width: 100%; box-sizing: border-box; background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(16,24,40,.14); padding: 30px 26px 24px; text-align: center; animation: popin .35s ease-out; }
.wlogo { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 16px; background: linear-gradient(135deg, #4A93EA, #2D7FDD); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(45,127,221,.35); }
.wlogo svg { width: 38px; height: 38px; fill: #fff; }
.wcard h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.wcard p { margin: 0 0 18px; color: #6B7A90; font-size: 13.5px; line-height: 1.5; }
.wcard .inp { text-align: center; margin-top: 10px; }
.wcard .btn { width: 100%; margin: 14px 0 0; padding: 13px; }

/* ---------- toast ---------- */
#toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(31,42,55,.92); color: #fff; font-size: 13px; padding: 9px 16px;
  border-radius: 999px; box-shadow: 0 8px 24px rgba(16,24,40,.25); opacity: 0; visibility: hidden; transition: opacity .25s, transform .25s, visibility .25s; z-index: 30; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app" class="hidden">
  <div id="header">
    <div class="meblock">
      <div class="avwrap" id="meAvWrap"><div class="av lg" id="meAv"></div><span class="status" id="meDot"></span></div>
      <div class="meText"><div class="name" id="meName">MiniChat</div><div class="sub" id="meSub">Tillgänglig · krypterat · via molnet</div></div>
    </div>
    <button class="ib" id="nudgeBtn" title="Knacka på"></button>
    <button class="ib" id="gearBtn" title="Inställningar"></button>
  </div>
  <div id="roster"></div>
  <div id="log"></div>
  <div id="composer">
    <div class="pill" id="pill">
      <button class="ib" id="attachBtn" title="Skicka fil"></button>
      <textarea id="input" rows="1" placeholder="Skriv ett meddelande…" enterkeyhint="send"></textarea>
      <button class="send off" id="sendBtn" title="Skicka"></button>
    </div>
    <div class="hint" id="hint">Skriv *prutt* eller *skratt* för ljud hos den andra</div>
  </div>
  <input type="file" id="filepick" multiple style="display:none">
  <input type="file" id="avpick" accept="image/*" style="display:none">
  <div id="menu" class="pop hidden"></div>
  <div id="toast"></div>
</div>

<div id="welcome" class="hidden">
  <div class="wcard">
    <div class="wlogo" id="wlogo"></div>
    <h1>Hej!</h1>
    <p>Skriv ditt namn och er familjekod – samma kod som i MiniChat på datorn. Inget konto behövs.</p>
    <input class="inp" id="wname" maxlength="32" placeholder="Ditt namn" autocomplete="off">
    <input class="inp" id="wcode" maxlength="64" placeholder="Familjekod" autocomplete="off" autocapitalize="none">
    <button class="btn pri" id="wbtn">Börja chatta</button>
  </div>
</div>

<div id="modal" class="hidden"><div class="bd" id="mbd"></div><div class="card" id="mcard"></div></div>

async function deriveKeys(code) {

  input.onfocus = () => { $('pill').className = 'pill focus'; unlockAudio(); };
  input.onblur = () => { $('pill').className = 'pill'; };
  log.onscroll = () => { stuck = log.scrollTop + log.clientHeight >= log.scrollHeight - 48; };
  document.addEventListener('click', e => { if (!menuEl.classList.contains('hidden') && !menuEl.contains(e.target) && !$('gearBtn').contains(e.target)) closeMenu(); if (!e.target.closest('.bubble')) document.querySelectorAll('.bubble.show').forEach(x => x.classList.remove('show')); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeModal(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { unread = 0; document.title = 'MiniChat'; if (!es || Date.now() - lastEvent > 90000) connect(); flushSeen(); sendHello(false); }
  });
  window.addEventListener('focus', () => { unread = 0; document.title = 'MiniChat'; });
  if (window.visualViewport) { const vv = window.visualViewport; const fit = () => { $('app').style.height = vv.height + 'px'; layout(); }; vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  setInterval(() => { renderRoster(); if (K) { sendHello(Date.now() - lastHello > 20 * 60000); if (es && Date.now() - lastEvent > 120000 && document.visibilityState === 'visible') connect(); } }, 60000);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }

  if (S.name && S.code) { showApp(false); renderMe(); replayHistory(); start(); }
  else showApp(true);
}
function finishWelcome() {
  const n = $('wname').value.trim(), c = $('wcode').value.trim();
  if (!n) { $('wname').focus(); return; }
  if (!c) { $('wcode').focus(); return; }
  S.name = cleanName(n); save();
  showApp(false); renderMe();
  setCode(c);
}
function makeAvatarData(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(img.width, img.height); const c = document.createElement('canvas'); c.width = c.height = 96; c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 96, 96); URL.revokeObjectURL(u); resolve(c.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('bild')); };
    img.src = u;
  });
}
